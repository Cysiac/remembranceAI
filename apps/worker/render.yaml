services:
  - type: web
    name: memorial-worker
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: apps/worker
    healthCheckPath: /healthz
    plan: starter
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ADAPTION_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: WORKER_ALLOWED_ORIGINS
        sync: false
