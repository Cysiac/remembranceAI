# Fly.io manifest for the Memorial AI FastAPI worker.
#
# First-time setup:
#   cd apps/worker
#   fly launch --no-deploy --copy-config        # use this fly.toml
#   fly secrets set \
#     ELEVENLABS_API_KEY=... \
#     ADAPTION_API_KEY=... \
#     SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... \
#     WORKER_SHARED_SECRET=... \
#     WORKER_ALLOWED_ORIGINS="https://memorial-ai.vercel.app"
#   fly deploy
#
# Then point Vercel:
#   vercel env add WORKER_URL          # https://memorial-worker.fly.dev
#   vercel env add WORKER_SHARED_SECRET  # same value as the secret above

app = "memorial-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

# Persona builds are bursty + memory-hungry (audio, KB doc bundling). 1 GB is a
# safe starting point; bump if /jobs starts OOM-killing.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
